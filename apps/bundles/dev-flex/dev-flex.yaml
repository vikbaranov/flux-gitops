apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  chart:
    spec:
      chart: cert-manager
      version: "*"
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: cert-manager
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: envoyproxy-gateway
  namespace: envoy-gateway-system
spec:
  ref:
    tag: "v1.8.3"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: n8n
  namespace: homelab
spec:
  chart:
    spec:
      chart: n8n
      version: "1.0.x"
      sourceRef:
        kind: HelmRepository
        name: 8gears
        namespace: homelab
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: podinfo
  namespace: homelab
spec:
  chart:
    spec:
      chart: podinfo
      version: ">=1.0.0-alpha"
      sourceRef:
        kind: HelmRepository
        name: podinfo
        namespace: homelab
