apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: podinfo
spec:
  test:
    enable: false
  values:
    image:
      repository: ghcr.io/stefanprodan/podinfo
      # renovate: datasource=docker depName=ghcr.io/stefanprodan/podinfo versioning=semver
      tag: "6.12.0"
    httpRoute:
      enabled: true
      parentRefs:
        - name: internal
          namespace: envoy-gateway-system
      hostnames:
        - podinfo.${cluster_subdomain}
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
    securityContext:
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      seccompProfile:
        type: RuntimeDefault
